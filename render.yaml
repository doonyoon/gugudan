services:
  - type: web
    name: goyangi-seongchaejeon
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: goyangi-seongchaejeon-db
          property: connectionString
databases:
  - name: goyangi-seongchaejeon-db
    plan: free
    databaseName: goyangi
    user: goyangi
